spring.application.name=visits-service
server.port=8082

# One database per service (ADR-003): in-memory H2 with the legacy schema and seed data
spring.datasource.url=jdbc:h2:mem:visits;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/visits/schema.sql
spring.sql.init.data-locations=classpath:db/visits/data.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Java 21 virtual threads
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# customers-service base URL (overridden by CUSTOMERS_SERVICE_URL in Docker Compose)
customers-service.url=${CUSTOMERS_SERVICE_URL:http://localhost:8081}
