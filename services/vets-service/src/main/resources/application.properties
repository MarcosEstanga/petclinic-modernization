spring.application.name=vets-service
server.port=8083

# One database per service (ADR-003): in-memory H2 with the legacy schema and seed data
spring.datasource.url=jdbc:h2:mem:vets;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/vets/schema.sql
spring.sql.init.data-locations=classpath:db/vets/data.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Java 21 virtual threads
spring.threads.virtual.enabled=true

# Caching (BR-VET-04): the legacy application used @Cacheable("vets") on the repository
spring.cache.type=caffeine
spring.cache.cache-names=vets
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=1h,recordStats

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
