spring.application.name=customers-service
server.port=8081

# One database per service (ADR-003): in-memory H2 with the legacy schema and seed data
spring.datasource.url=jdbc:h2:mem:customers;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/customers/schema.sql
spring.sql.init.data-locations=classpath:db/customers/data.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Java 21 virtual threads
spring.threads.virtual.enabled=true

# Actuator: only the endpoints an operator needs (the monolith exposed everything, see BR-SYS-05)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
