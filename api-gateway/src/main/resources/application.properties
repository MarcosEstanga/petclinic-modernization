spring.application.name=api-gateway
server.port=8080

# Downstream services (overridden in Docker Compose by the environment variables)
customers-service.url=${CUSTOMERS_SERVICE_URL:http://localhost:8081}
vets-service.url=${VETS_SERVICE_URL:http://localhost:8083}
visits-service.url=${VISITS_SERVICE_URL:http://localhost:8082}

# Java 21 virtual threads
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Aggregated Swagger UI: one tab per service, each one served through the gateway itself
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Customers
springdoc.swagger-ui.urls[0].url=/api/customers/v3/api-docs
springdoc.swagger-ui.urls[1].name=Vets
springdoc.swagger-ui.urls[1].url=/api/vets/v3/api-docs
springdoc.swagger-ui.urls[2].name=Visits
springdoc.swagger-ui.urls[2].url=/api/visits/v3/api-docs
springdoc.swagger-ui.urls[3].name=Gateway
springdoc.swagger-ui.urls[3].url=/v3/api-docs

# Composition clients use 2 s connect / 5 s read timeouts (ClientsConfiguration).
# Proxied routes are forwarded by the gateway's own HTTP client (see README "Limitaciones").
